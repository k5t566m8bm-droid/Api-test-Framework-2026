name: API Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      - name: 配置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行自动化全量回归测试 (4核并发)
        run: pytest -m regression --env=test -n 4

      - name: 保存 Allure 测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: allure-results
          path: allure-results/